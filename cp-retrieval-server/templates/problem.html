{% extends "base.html" %}
{% block title %}{{ title }} · {{ t.site_short }}{% endblock %}
{% block content %}
<a class="crumb" href="{{ url_for('index', qid=query_id, page=page if query_id else None, lang=lang, oj=oj_link, mmr=('1' if params.mmr else '0'), dedup=('1' if params.dedup else '0'), cluster=params.cluster) }}">
  ← {{ t.back }}
</a>

<header class="problem-head glass">
  <h1 class="problem-title">{{ title }}</h1>
  <div class="problem-meta">
    {% if source %}<span class="oj-tag">{{ source }}</span>{% endif %}
    <span class="muted">#{{ pid }}</span>
    <span class="spacer"></span>
    <a class="btn btn-primary btn-sm" href="{{ url | safe_url }}" target="_blank" rel="noopener noreferrer">{{ t.view_origin }} ↗</a>
  </div>
</header>

<article class="statement glass">
  <div class="statement-inner">{{ text_html }}</div>
</article>

<div class="problem-foot">
  <a class="btn btn-ghost" href="{{ url_for('index', qid=query_id, page=page if query_id else None, lang=lang, oj=oj_link, mmr=('1' if params.mmr else '0'), dedup=('1' if params.dedup else '0'), cluster=params.cluster) }}">← {{ t.back }}</a>
  <a class="btn btn-ghost" href="{{ url | safe_url }}" target="_blank" rel="noopener noreferrer">{{ t.view_origin }} 🔗</a>
</div>
{% endblock %}
